[package]
name = "libc-support-tools"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
libc6 = { path = "../libc6" }
ldso = { path = "../ldso" }

[[bin]]
name = "safe-loader-tool"
path = "src/bin/safe-loader-tool.rs"

[[bin]]
name = "safe-runtime-tool"
path = "src/bin/safe-runtime-tool.rs"

[[bin]]
name = "safe-network-tool"
path = "src/bin/safe-network-tool.rs"

[[bin]]
name = "safe-locale-tool"
path = "src/bin/safe-locale-tool.rs"

[[bin]]
name = "safe-aux-tool"
path = "src/bin/safe-aux-tool.rs"
