[workspace]
members = [
    "xtask",
    "crates/libc-support-tools",
    "crates/core-runtime",
    "crates/ldso",
    "crates/libc6",
    "crates/libpthread",
    "crates/libthread-db",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.27", features = ["derive"] }
glob = "0.3.2"
libc = "0.2.186"
regex = "1.11.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
sha2 = "0.10.8"
tempfile = "3.15.0"
toml = "0.8.19"
walkdir = "2.5.0"
