[metadata]
phase = "impl_06_io_stdio_string_path"
notes = [
    "Required-package baselines remain derived from the checked-in build/testroot.pristine tree, while the committed packaging surface now lives under safe/debian/** and safe/generated/packaging/package-build-manifest.json.",
    "Later phases must consume the committed safe packaging files in place instead of reading undeclared inputs from original/debian/**.",
    "libc6-dbg is derived only from the libc6 ELF payload baseline and not from libc-bin, libc-dev-bin, or nscd.",
    "Phase 3 adds Debian package scaffolding, local apt-repository installation, libc-support-tools fallback-backed entrypoints, and in-place root-harness provenance checks.",
    "Phase 4 keeps required package manifests in place, switches loader entrypoints to Rust frontends, and explicitly tracks any remaining loader backend binaries.",
    "Phase 5 keeps required package manifests in place, switches runtime entrypoints such as pldd to Rust frontends, and explicitly tracks any remaining runtime or loader backend binaries.",
    "Phase 6 keeps required package manifests in place, cuts the first libc-family public DSOs and public libc6-dev link names over to safe-built payloads, and tracks any remaining baseline backend DSOs under explicit private package paths.",
]

[debug_derivation]
derived_from_package = "libc6"
excludes_packages = [
    "libc-bin",
    "libc-dev-bin",
    "nscd",
]
package = "libc6-dbg"

