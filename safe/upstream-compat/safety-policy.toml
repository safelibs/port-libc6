phases = [
    "impl_01_safe_bootstrap",
    "impl_02_hybrid_abi_shell",
    "impl_03_packaging_and_harness",
    "impl_04_loader_startup_secure_exec",
    "impl_05_core_runtime_threads_entropy",
    "impl_06_io_stdio_string_path",
    "impl_07_nss_resolver_nscd",
    "impl_08_locale_iconv_posix_parsers",
    "impl_09_math_and_aux_dsos",
    "impl_10_final_fixup_and_audit",
]

[metadata]
notes = [
    "Committed Debian maintainer scripts, debconf templates, helper shell fragments, and harness glue under safe/debian/**, safe/scripts/install-safe-repo.sh, and test-original.sh remain tracked policy exceptions for this phase.",
    "Phase 5 auto-populates reviewed unsafe and reviewed fallback entry tables from the committed runtime crates and fallback inventory.",
    "Phase 6 auto-populates reviewed unsafe and reviewed fallback entry tables from the committed crates and fallback inventory while package-scope tracks any remaining private baseline backend DSOs.",
    "Phase 7 auto-populates reviewed unsafe and reviewed fallback entry tables from the committed crates and fallback inventory while package-scope tracks the copied upstream network backends explicitly.",
    "Phase 8 auto-populates reviewed unsafe and reviewed fallback entry tables from the committed crates and fallback inventory while package-scope tracks the preserved locale helper backends explicitly.",
    "Phase 8 auto-populates reviewed unsafe and reviewed fallback entry tables from the committed crates and fallback inventory while package-scope tracks private DSO backends and confirms locale helper backend removal explicitly.",
    "Phase 9 auto-populates reviewed unsafe and reviewed fallback entry tables from the committed crates and fallback inventory while package-scope confirms dev/time helper backend removal explicitly.",
    "Phase 10 auto-populates reviewed unsafe and reviewed fallback entry tables from the committed crates and fallback inventory while package-scope confirms private backend removal explicitly.",
]
phase = "impl_10_final_fixup_and_audit"
phase_note = "Phase 10 enforces final package closure: no shipped temporary fallback binaries and no shipped private baseline backend DSOs."
purpose = "Authoritative policy schema for unsafe Rust reviews, tracked non-Rust fallbacks, and cross-manifest safety validation."

[phase_modes.impl_01_safe_bootstrap]
strongest_mode = "--verify-policy"

[phase_modes.impl_02_hybrid_abi_shell]
strongest_mode = "--verify-policy"

[phase_modes.impl_03_packaging_and_harness]
strongest_mode = "--verify-policy"

[phase_modes.impl_04_loader_startup_secure_exec]
strongest_mode = "--verify-policy"

[phase_modes.impl_05_core_runtime_threads_entropy]
strongest_mode = "--deny-unreviewed-unsafe --deny-untracked-fallback-c"

[phase_modes.impl_06_io_stdio_string_path]
strongest_mode = "--deny-unreviewed-unsafe --deny-untracked-fallback-c"

[phase_modes.impl_07_nss_resolver_nscd]
strongest_mode = "--deny-unreviewed-unsafe --deny-untracked-fallback-c"

[phase_modes.impl_08_locale_iconv_posix_parsers]
strongest_mode = "--deny-unreviewed-unsafe --deny-untracked-fallback-c"

[phase_modes.impl_09_math_and_aux_dsos]
strongest_mode = "--deny-unreviewed-unsafe --deny-untracked-fallback-c"

[phase_modes.impl_10_final_fixup_and_audit]
strongest_mode = "--deny-unreviewed-unsafe --deny-untracked-fallback-c --deny-shipped-temporary-fallback-binaries --deny-shipped-private-backend-dsos --require-cve-disposition --require-package-scope-clean"

[policy]
allowed_cve_statuses = [
    "open",
    "mitigated",
    "not-applicable",
]
cross_reference_files = [
    "safe/generated/baseline/fallback-c-inventory.json",
    "safe/upstream-compat/package-scope.toml",
    "safe/upstream-compat/cve-status.toml",
    "safe/generated/security/relevant-cves-index.json",
]
deny_shipped_private_backend_dso_by_phase = "impl_10_final_fixup_and_audit"
deny_shipped_temporary_fallback_binary_by_phase = "impl_10_final_fixup_and_audit"
forbid_shipped_private_backend_dsos = true
forbid_shipped_temporary_fallback_binaries = true

[reviewed_fallback]
notes = "Every tracked non-Rust fallback or assembly shim must be represented in fallback-c-inventory.json and reviewed here once introduced."
required_fields = [
    "path",
    "classification",
    "owning_phase",
    "shipped",
    "audit_notes",
    "reviewer",
]

