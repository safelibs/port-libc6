[metadata]
phase = "impl_06_io_stdio_string_path"
notes = [
    "Status values remain baseline_captured until later implementation phases replace the relevant components under safe/**.",
    "All check-abi --all-dsos targets are seeded here so later phases consume a single committed status ledger.",
    "Phase 3 records committed Debian packaging scaffolding, local apt-repository installation, and in-place root-harness provenance verification while later owning phases retain subsystem ownership.",
    "The upstream-compatible test tree is synced from committed source artifacts instead of being rediscovered from makefiles.",
    "Phase 4 ports loader control-plane state into Rust while the loader ABI shell remains available for unresolved backend work.",
    "The safe test tree carries every phase-4-owned loader, startup, and amd64 sysdeps test entry from the committed ownership plan.",
    "Loader helper entrypoints now ship Rust frontends with any unavoidable backend binaries tracked as explicit fallback exceptions.",
    "Phase 5 ports core runtime, thread, entropy, and low-level libc bookkeeping into committed Rust crates while the hybrid ABI shells remain the externally linked surface.",
    "The safe test tree carries every phase-5-owned runtime, thread, malloc, signal, setjmp, misc, and nptl_db entry from the committed ownership plan.",
    "Runtime helper entrypoints now ship Rust frontends where possible, and audit-safety tracks reviewed unsafe sites plus reviewed fallback inventory coverage.",
    "Phase 6 cuts the first libc-family public DSOs and public libc6-dev link names over to safe-built payloads while keeping later-phase package obligations explicitly inventoried.",
    "The safe test tree carries every phase-6-owned stdio, string, io, dirent, time, timezone, assert, ctype, and termios entry from the committed ownership plan.",
    "check-owned-tests validates exact ownership completeness against the committed test catalog and test-port plan before it executes ported rows.",
    "stage-upstream-build is the only supported way to adopt or recreate safe/work/original-build for relink smokes, package derivation, and upstream-test execution.",
    "Phase 7 extends the safe-built public DSO cutover to the network-facing libc family while keeping explicit private backend inventory for the copied upstream payloads.",
    "The safe test tree carries every phase-7-owned hesiod, inet, nis, nss, resolv, socket, and sysdeps entry from the committed ownership plan together with the shared script rows and the tracked nscd zero-entry sentinel.",
    "Phase 8 extends the safe-built public DSO cutover to libBrokenLocale, replaces the remaining locale/iconv helper wrappers with Rust frontends or first-class scripts, and keeps explicit backend inventory only where helper binaries still delegate to preserved upstream payloads.",
    "The safe test tree carries every phase-8-owned conform, iconv, iconvdata, locale, localedata, posix, and sysdeps entry from the committed ownership plan together with the tracked po zero-entry sentinel and shared script rows.",
    "Phase 9 extends the safe-built public DSO cutover through libdl, libm, libmvec, libpcprofile, librt, and libutil, replaces the remaining math/dev/time helper wrappers with Rust frontends, and keeps explicit backend inventory only for the temporary backend DSOs and helper payloads that remain phase-10 cleanup.",
    "The safe test tree carries every phase-9-owned argp, catgets, debug, dlfcn, gmon, gnulib, intl, login, math, mathvec, resource, rt, sunrpc, sysvipc, wcsmbs, wctype, and normalized sysdeps entry from the committed ownership plan together with the tracked manual zero-entry sentinel and shared script rows.",
    "Phase 6 moves the first libc-family public DSO payloads onto the safe build path, keeps private baseline backend copies explicitly inventoried, and records remaining libc6-dev build-testroot carryovers as final-cutover obligations.",
    "The safe test tree carries every phase-6-owned stdio, stdlib, libio, string, io, time, dirent, assert, ctype, termios, timezone, normalized sysdeps, generated placeholder, and shared script row from the committed ownership plan.",
]

