[metadata]
phase = "impl_05_core_runtime_threads_entropy"
notes = [
    "Status values remain baseline_captured until later implementation phases replace the relevant components under safe/**.",
    "All check-abi --all-dsos targets are seeded here so later phases consume a single committed status ledger.",
    "Phase 3 records committed Debian packaging scaffolding, local apt-repository installation, and in-place root-harness provenance verification while later owning phases retain subsystem ownership.",
    "The upstream-compatible test tree is synced from committed source artifacts instead of being rediscovered from makefiles.",
    "Phase 4 ports loader control-plane state into Rust while the loader ABI shell remains available for unresolved backend work.",
    "The safe test tree carries every phase-4-owned loader, startup, and amd64 sysdeps test entry from the committed ownership plan.",
    "Loader helper entrypoints now ship Rust frontends with any unavoidable backend binaries tracked as explicit fallback exceptions.",
    "Phase 5 ports core runtime, thread, entropy, and low-level libc bookkeeping into committed Rust crates while the hybrid ABI shells remain the externally linked surface.",
    "The safe test tree carries every phase-5-owned runtime, thread, malloc, signal, setjmp, misc, and nptl_db entry from the committed ownership plan.",
    "Runtime helper entrypoints now ship Rust frontends where possible, and audit-safety tracks reviewed unsafe sites plus reviewed fallback inventory coverage.",
]

